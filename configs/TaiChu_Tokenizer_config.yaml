# TaiChu Byte-Level BPE Tokenizer training configuration.

data:
  files:
    # Formal 4.0 GB tokenizer corpus: Chinese 3.201 GB + English 0.803 GB.
    - 'E:\Academic\Datasets\TaiChu\Pretrain\tokenizer\ch\*.jsonl'
    - 'E:\Academic\Datasets\TaiChu\Pretrain\tokenizer\en\*.jsonl'
  epoch: 1
  text_key: "text"

  # Character-based guard, not a byte count. Truncation is counted in logs.
  max_text_chars: 200000
  skip_empty: true

  # The old Python process pool is intentionally disabled. Tokenizers performs
  # native pretokenization in parallel without duplicating the Python heap.
  num_workers: 1

  # Only used for a top-level JSON object. JSONL and top-level JSON arrays are
  # always streamed and do not need this setting.
  json_prefix: null
  allow_full_json_load: false

# NFC preserves Chinese punctuation and avoids collapsing newlines or code
# indentation. Whitespace normalization caused lossy tokenizer round trips.
normalizer:
  type: "nfc"

pre_tokenizer:
  type: "bytelevel"
  add_prefix_space: false
  use_regex: true
  digit_split: true

trainer:
  vocab_size: 32768
  min_frequency: 2
  show_progress: true

runtime:
  monitor_interval_seconds: 0.1
  progress_every_records: 100000
  # true 时在训练进程内执行完整 Transformers 重载和 Jinja 渲染，峰值会明显增加。
  # 轻量原生重载默认开启；完整验证可用 trainer.validate_tokenizer 单独执行。
  full_reload_validation: false

model_meta:
  name: "TaiChu"
  version: "1.0.0"
  author: "Hsuan Tong"
  license: "Apache 2.0"
  description: "Tokenizer for TaiChu large language model"
  contact: "hsuantx@163.com"

save:
  directory: "../experiments/tokenizer_zh_en_32k"
  model_max_length: 32768
  overwrite: true
