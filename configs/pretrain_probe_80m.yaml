# TaiChu 80M raw-text continuation probe configuration.

checkpoint: "../experiments/80m_8B/taichu_80m_pretrain_v1/best_models/TaiChu_80M.pt"
tokenizer: "../taichu_tokenizer"

device: "auto"
dtype: "auto"
context_tokens: null

# Raw next-token continuation uses the model's ordinary pretraining distribution.
sampling:
  max_new_tokens: 256
  temperature: 0.2
  top_k: 5
  top_p: 0.9
  repetition_penalty: 1.00
  seed: 42
