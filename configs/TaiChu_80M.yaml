# TaiChu 80M dense decoder-only 模型配置。
# 使用仓库自带 32768 词表 Tokenizer 时，参数量为 80,757,248。

# 模型配置名称；用于日志、实验和检查点追踪。
model_name: "TaiChu-80M"

# Transformer 主体结构。
architecture:
  # Tokenizer 词表大小；必须与 Tokenizer 实际词表一致或更大。
  vocab_size: 32768
  # 隐藏层维度。
  hidden_size: 512
  # Transformer 解码器层数。
  num_layers: 16
  # Query 注意力头数。
  num_attention_heads: 8
  # Key/Value 注意力头数；小于 Query 头数时启用 GQA。
  num_key_value_heads: 2
  # SwiGLU 前馈层中间维度。
  intermediate_size: 2176
  # 位置编码支持的最大上下文长度。
  max_position_embeddings: 2048
  # RoPE 基础频率。
  rope_theta: 10000.0
  # RMSNorm 数值稳定项。
  rms_norm_eps: 1.0e-6
  # 是否共享输入 Embedding 与输出 Head 权重。
  tie_word_embeddings: true

# 激活函数与前馈网络类型。
activation:
  # SwiGLU 内部使用的 SiLU 激活函数。
  hidden_act: "silu"
  # 前馈网络实现；swiglu 表示门控前馈网络。
  ffn_type: "swiglu"

# 注意力实现配置。
attention:
  # 是否优先使用 FlashAttention；不可用时自动回退到其他 SDPA 后端。
  use_flash_attention: true

# Dropout 正则化配置。
regularization:
  # 注意力权重 Dropout 概率。
  attention_dropout: 0.0
  # Transformer 隐藏层残差 Dropout 概率。
  hidden_dropout: 0.0
  # Token Embedding Dropout 概率。
  embedding_dropout: 0.0
