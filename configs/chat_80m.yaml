# TaiChu 80M conversational entry configuration.

# Best validation inference artifact from the local 80M experiment.
checkpoint: "../experiments/80m/taichu_80m_pretrain_v1/best_models/best_model.pt"

# Hugging Face-compatible tokenizer bundle containing chat_template.jinja.
tokenizer: "../taichu_tokenizer"

# The pretrained checkpoint remains the primary system prompt context.
system_prompt: "你是 TaiChu（太初），一个诚实、清晰的中文对话助手。回答应直接、准确；不确定时明确说明。"

# auto selects CUDA when available; CPU falls back to float32.
device: "auto"
dtype: "auto"

# null uses the checkpoint's max_position_embeddings.
context_tokens: null

sampling:
  max_new_tokens: 256
  temperature: 0.8
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.05
  seed: 42
