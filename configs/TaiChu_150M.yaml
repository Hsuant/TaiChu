# TaiChu 150M dense decoder-only model.
# Actual parameter count with the bundled 32768-token tokenizer: 149,057,280.
model_name: "TaiChu-150M"

architecture:
  vocab_size: 32768
  hidden_size: 768
  num_layers: 18
  num_attention_heads: 12
  num_key_value_heads: 4
  intermediate_size: 2304
  max_position_embeddings: 2048
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-6
  tie_word_embeddings: true

activation:
  hidden_act: "silu"
  ffn_type: "swiglu"

attention:
  use_flash_attention: true

regularization:
  attention_dropout: 0.0
  hidden_dropout: 0.0
  embedding_dropout: 0.0
