# End-to-end sample configuration using bundled data.
#   python -m dataset.offline.prepare --config configs/prepare_pretrain_sample.yaml

tokenizer_path: "./taichu_tokenizer/tokenizer.json"
output_dir: "./data/unified/sample"

task_type: "pretraining"
dataset_id: "taichu-sample-v1"
version: "1"

text_column: "text"
max_seq_length: 64

pad_token: "<|pad|>"
bos_token: "<|taichu_start|>"
eos_token: "<|taichu_end|>"
add_bos: true
add_eos: true
invalid_policy: "error"
shard_size: 100

cleaning:
  unicode_form: "NFC"
  min_chars: 16
  max_chars: 200000
  collapse_whitespace: false
  remove_control_chars: true
  oversize_policy: "skip"
  deduplicate: true

splits:
  train:
    - "./data/samples/pretrain/train.jsonl"
  validation:
    - "./data/samples/pretrain/val.jsonl"
