# Raw text -> cleaned text -> typed sample -> tokenized binary shards.
# Run from the project root:
#   python -m dataset.offline.prepare --config configs/prepare_pretrain_data.yaml

task_type: "pretraining"
dataset_id: "taichu-pretraining-v1"
version: "1"

tokenizer_path: "./taichu_tokenizer/tokenizer.json"
output_dir: "./data/unified/taichu_80m"

text_column: "text"
max_seq_length: 2048

pad_token: "<|pad|>"
bos_token: "<|taichu_start|>"
eos_token: "<|taichu_end|>"
add_bos: true
add_eos: true
invalid_policy: "error"
shard_size: 50000

cleaning:
  unicode_form: "NFC"
  min_chars: 16
  max_chars: 200000
  collapse_whitespace: false
  remove_control_chars: true
  oversize_policy: "skip"
  deduplicate: true

splits:
  train:
    - "./data/raw/train"
  validation:
    - "./data/raw/validation"
