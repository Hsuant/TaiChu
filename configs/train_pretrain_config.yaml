# ============================================================================
# TaiChu 80M LLM Pretraining - Example Configuration
# Dataset Loader: TaiChu Dataset Loader v0.2.0
#
# IMPORTANT
# - The data section is parsed by UnifiedDataConfig.from_yaml().
# - The other sections are application/training settings; they are read by
#   your training entrypoint, not by UnifiedDataConfig.
# - There is only ONE runtime: indexed binary shards + mmap + PyTorch DataLoader.
# - Raw JSONL/JSONL.GZ/Parquet enter only the offline preparation pipeline.
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Experiment metadata (training application)
# ----------------------------------------------------------------------------

project:
  name: "TaiChu"
  task: "causal_lm_pretraining"
  model_size: "80M"
  experiment_name: "taichu_80m_pretrain_v1"
  seed: 42

# ----------------------------------------------------------------------------
# 2. Tokenizer (initialized by the training entrypoint)
# ----------------------------------------------------------------------------
# Example for the native `tokenizers` package:
#   from tokenizers import Tokenizer
#   tokenizer = Tokenizer.from_file(config["tokenizer"]["path"])
#   factory = TaiChuDataLoaderFactory(dataset_config, tokenizer)
#
# This section is NOT part of UnifiedDataConfig. The training entrypoint
# creates the tokenizer object and passes it into TaiChuDataLoaderFactory.

tokenizer:
  library: "tokenizers"
  path: "./taichu_tokenizer/tokenizer.json"
  special_tokens:
    pad: "<|pad|>"
    bos: "<|taichu_start|>"
    eos: "<|taichu_end|>"

# ----------------------------------------------------------------------------
# 3. Unified dataset loader configuration
# ----------------------------------------------------------------------------
# Training reads versioned binary shards through a single mmap-backed runtime.

data:
  schema_version: 1
  task_type: pretraining
  dataset_id: taichu-pretraining-v1

  storage:
    format: binary_mmap
    train_path: "./data/unified/taichu_80m/train"
    validation_path: "./data/unified/taichu_80m/validation"
    verify_checksums: false
    num_workers: 2
    prefetch_factor: 2

  sampling:
    strategy: distributed
    shuffle: true
    seed: 42
    drop_last: true
    pad_to_world_size: true

  # Special token strings used to resolve IDs from the tokenizer.
  pad_token: "<|pad|>"
  bos_token: "<|taichu_start|>"
  eos_token: "<|taichu_end|>"

  packing:
    enabled: true
    strategy: stream
    max_seq_length: 2048
    pad_to_multiple_of: 8
    drop_last_remainder: false

  batching:
    strategy: fixed_length
    micro_batch_size: 8
    pad_to_multiple_of: 8
    padding_free: false

# ----------------------------------------------------------------------------
# 4. Model configuration (training application)
# ----------------------------------------------------------------------------
# These are descriptive settings for the training program. The Dataset Loader
# does not construct or modify the model.

model:
  name: "TaiChu-80M"
  parameter_count: 80000000
  max_position_embeddings: 2048
  objective: "causal_language_modeling"

# ----------------------------------------------------------------------------
# 5. Optimizer (training application)
# ----------------------------------------------------------------------------

optimizer:
  name: "adamw"
  learning_rate: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8

# ----------------------------------------------------------------------------
# 6. Learning-rate scheduler (training application)
# ----------------------------------------------------------------------------
# Target-token scheduling should be driven by the training loop's actual
# consumed-token counter. The ratios below describe the intended schedule.

scheduler:
  name: "warmup_stable_decay"
  warmup_ratio: 0.02
  stable_ratio: 0.70
  min_lr_ratio: 0.1
  decay_type: "cosine"

# ----------------------------------------------------------------------------
