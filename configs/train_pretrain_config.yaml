# TaiChu 预训练参数配置

optimizer:
  learning_rate: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8

scheduler:
  warmup_ratio: 0.01          # 预热步数占总步数的比例（1%）
  min_lr_ratio: 0.1           # 最终学习率比例

data:
  # 训练数据文件列表（支持通配符）
  train_files:
    - "./dataset/test/test_pretrain_train.jsonl"
  # 验证数据文件列表
  val_files:
    - "./dataset/test/test_pretrain_eval.jsonl"
  tokenizer_path: "./taichu_tokenizer/tokenizer.json"
  max_seq_length: 2048
  text_field: "text"   # 若 JSON 中文本键为 "text"
  # 若已预分词，可设为 true 并指定 pre_tokenized_dir
  from_pre_tokenized: false
  pre_tokenized_dir: "./data/tokenized"
  num_workers: 2

training:
  target_tokens: "12B"      # 总训练 token 数（不变量），最优训练 token 数 ≈ 20 × 参数量,1B=10^9, 遵循 Chinchilla 定律
  batch_size: 1
  gradient_accumulation_steps: 1
  save_interval: 5000
  log_interval: 10
  output_dir: "./experiments"
  experiment_name: "TaiChu_LMM_pretrain_v1"
  use_mixed_precision: false
  dtype: "bfloat16"
  seed: 42
  # 设备选择配置：
  #
  # 【自动模式（推荐）】-1
  #   - 若有 CUDA GPU：使用 cuda:0（第一块 GPU）
  #   - 若多卡训练（torchrun）：自动继承环境变量 LOCAL_RANK，每个进程使用对应 GPU
  #   - 若无 CUDA：回退 CPU
  #
  # 【手动指定 GPU 编号】0, 1, 2, ...
  #   - 强制使用 cuda:N（前提是该编号 GPU 存在且 CUDA 可用）
  #   - 若 CUDA 不可用，则自动降级为 CPU
  #
  # 【强制 CPU 训练】任意值 + 环境变量
  #   - 仅设置 local_rank 无法强制 CPU，需配合：export CUDA_VISIBLE_DEVICES=""
  #   - 此时无论 local_rank 为何值，device 均为 cpu
  local_rank: -1

# 测试配置
evaluating:
  batch_size: 2
  eval_interval: 20
  log_interval: 10
  prompts: # 20个覆盖多维度能力的生成前缀（无指令，适合基座模型）
    # 常识与事实知识
    - "The capital of France is"                          # 地理知识
    - "水在标准大气压下的沸点是"                               # 中文物理常识
    - "The process of photosynthesis converts"            # 生物知识
    - "Albert Einstein is best known for"                 # 历史/人物
    # 逻辑推理与因果关系
    - "If you drop a glass on a concrete floor, it"       # 物理因果
    - "All mammals have hair. A whale is a mammal, so"    # 三段论推理
    - "因为下雨，所以地面"                                    # 中文因果
    # 数学与代码
    - "The derivative of x^3 is"                          # 数学
    - "The output of `2 + 3 * 4` is"                      # 算术表达式
    # 叙事与创造性写作
    - "Once upon a time in a distant galaxy,"             # 故事开头（英文）
    - "深夜，一只猫悄悄地爬上了"                               # 中文叙事
    - "She looked out the window and saw"                 # 情景描写
    # 多语言（根据模型语料比例选择）
    - "Le futur de l'intelligence artificielle est"       # 法语
    - "Der Prozess des maschinellen Lernens beginnt mit"  # 德语
    - "Deep learning is powerful because"                 # 英文
    - "人工智能的未来是"                                     # 中文
    # 列表/枚举与结构化输出
    - "The three primary colors are"                      # 简单枚举
    - "为了保持健康，你应该"                                  # 建议列表
    - "Steps to solve a quadratic equation: first"        # 过程描述
    # 对话式/角色模拟（无指令形式，仅自然前缀）
    - "User: What's the weather like today?\nAssistant:"  # 对话延续（测试角色一致性）
    - "客服：您好，请问有什么可以帮您？\n客户："                  # 中文客服场景
    # 抽象与哲学
    - "Consciousness is often defined as"                 # 抽象定义
    - "时间就像"                                            # 比喻类
  num_generate_tokens: 50   # 每个提示生成的 token 数量

# 早停配置
early_stopping:
  enabled: false                # 是否启用早停（默认关闭）
  monitor: "val_loss"           # 监控的验证指标名称
  patience: 5                   # 连续无改善的最大验证次数
  min_delta: 1e-4               # 判定改善的最小绝对变化量
  mode: "min"                   # 优化方向：'min' 或 'max'

# SwanLab 实验跟踪配置
swanlab:
  use_swanlab: false                     # 是否启用 SwanLab
  swanlab_project: "TaiChu-Pretrain"    # 项目名称
  swanlab_experiment_name: "TaiChu_LLM_Pretrain"  # 实验名称，可选
  swanlab_log_dir: "./swanlogs"         # 本地日志目录
  swanlab_mode: "cloud"                 # 可选 "cloud" 或 "local"