task_type: "ppo"
dataset_id: "taichu-trajectory-offline-v1"
version: "1"

tokenizer_path: "./taichu_tokenizer/tokenizer.json"
output_dir: "./data/unified/trajectory"

add_eos: true
invalid_policy: "error"
shard_size: 50000

pad_token: "<|pad|>"
bos_token: "<|taichu_start|>"
eos_token: "<|taichu_end|>"

splits:
  train:
    - "./data/raw/trajectory/train"
  validation:
    - "./data/raw/trajectory/validation"
