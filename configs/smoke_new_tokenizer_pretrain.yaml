optimizer:
  learning_rate: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8

scheduler:
  warmup_ratio: 0.1
  stable_ratio: 0.7
  min_lr_ratio: 0.0
  decay_type: "cosine"

tokenizer:
  library: "tokenizers"
  path: "./taichu_tokenizer/tokenizer.json"

data:
  schema_version: 1
  task_type: pretraining
  dataset_id: taichu-smoke-v1
  storage:
    format: binary_mmap
    train_path: "./data/unified/sample/train"
    validation_path: "./data/unified/sample/validation"
    num_workers: 0
    prefetch_factor: 2
  sampling:
    strategy: distributed
    shuffle: true
    seed: 42
    drop_last: false
  bos_token: "<|taichu_start|>"
  eos_token: "<|taichu_end|>"
  pad_token: "<|pad|>"
  packing:
    enabled: true
    strategy: stream
    max_seq_length: 64
    pad_to_multiple_of: 1
    drop_last_remainder: true
  batching:
    strategy: fixed_length
    micro_batch_size: 2
    pad_to_multiple_of: 1

training:
  target_tokens: "1K"
  batch_size: 2
  gradient_accumulation_steps: 1
  save_interval: 8
  log_interval: 1
  output_dir: "./experiments/train_smoke"
  experiment_name: "new_tokenizer_dataset_test"
  use_mixed_precision: false
  dtype: "bfloat16"
  seed: 42
  local_rank: -1
  compile_model: false
  max_grad_norm: 1.0

evaluating:
  batch_size: 2
  eval_interval: 8
  log_interval: 5
  prompts: []
  num_generate_tokens: 1

early_stopping:
  enabled: false
  monitor: "val_loss"
  patience: 3
  min_delta: 1.0e-4
  mode: "min"

swanlab:
  use_swanlab: false
  swanlab_project: "TaiChu-Smoke"
  swanlab_experiment_name: "new_tokenizer_dataset_test"
  swanlab_log_dir: "./swanlogs"
  swanlab_mode: "local"
