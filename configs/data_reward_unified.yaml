# 通用奖励模型 Runtime 数据配置样例。
# 该文件只描述奖励样本的读取、采样和成对 Batch 构造方式。
#
# 使用说明：先运行 prepare_reward_data.yaml，再按生成目录替换 storage 路径。
# 当前路径均为项目内示例，dataset_id 必须与 Manifest 保持一致。

# 数据配置根节点。
data:
  # 统一数据配置 Schema 版本；当前只支持 1。
  schema_version: 1
  # 训练任务类型；奖励模型使用 reward。
  task_type: reward
  # 数据集稳定标识；断点恢复会校验该值。
  dataset_id: taichu-reward-v1

  # Parquet Dataset 存储与读取配置。
  storage:
    # 存储后端类型；当前只支持 parquet。
    format: parquet
    # 奖励训练集目录。
    train_path: ./data/unified/reward/train
    # 奖励验证集目录。
    validation_path: ./data/unified/reward/validation
    # 每个 DataLoader 的子进程数；0 表示主进程读取。
    num_workers: 2

  # 样本采样配置。
  sampling:
    # 采样策略；distributed 支持单卡与多卡 Rank 分片。
    strategy: distributed
    # 是否在每个 Epoch 重新打乱样本顺序。
    shuffle: true
    # 采样顺序的固定随机种子。
    seed: 42

  # 运行时序列拼接配置。
  packing:
    # 奖励样本需要成对比较，因此禁用跨样本 Packing。
    enabled: false
    # 无 Packing 策略。
    strategy: none
    # 单条奖励样本允许的最大长度。
    max_seq_length: 4096

  # Batch 张量构造配置。
  batching:
    # reward_pair 输出成对奖励 Batch。
    strategy: reward_pair
    # Batch 序列长度向上对齐的倍数。
    pad_to_multiple_of: 8
