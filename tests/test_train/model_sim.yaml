# 模拟训练用的极小模型配置（验证训练链路用，非正式规模）
model_name: "TaiChu-Sim"
vocab_size: 32768
hidden_size: 128
num_layers: 2
num_attention_heads: 8
num_key_value_heads: 4
intermediate_size: 512
max_position_embeddings: 64
rope_theta: 10000.0
rms_norm_eps: 1e-6
tie_word_embeddings: true
hidden_act: "silu"
ffn_type: "swiglu"
regularization:
  attention_dropout: 0.0
  hidden_dropout: 0.0
  embedding_dropout: 0.0
