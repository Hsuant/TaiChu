# 模拟预训练配置（CPU 可跑通，验证数据加载 → 训练 → 验证 → 检查点全链路）
optimizer:
  learning_rate: 3e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  epsilon: 1e-8
scheduler:
  warmup_ratio: 0.1
  stable_ratio: 0.6
  min_lr_ratio: 0.0
  decay_type: "cosine"
tokenizer:
  library: "tokenizers"
  path: "./taichu_tokenizer/tokenizer.json"

data:
  schema_version: 1
  task_type: pretraining
  dataset_id: taichu-sim-v1
  storage:
    format: binary_mmap
    train_path: "./tests/test_train/unified/train"
    validation_path: "./tests/test_train/unified/validation"
    num_workers: 0
    prefetch_factor: 2
  sampling:
    strategy: distributed
    shuffle: true
    seed: 42
    drop_last: false
  bos_token: "<|taichu_start|>"
  eos_token: "<|taichu_end|>"
  pad_token: "<|pad|>"
  packing:
    enabled: true
    strategy: stream
    max_seq_length: 64
    pad_to_multiple_of: 1
    drop_last_remainder: false
  batching:
    strategy: fixed_length
    micro_batch_size: 4
    pad_to_multiple_of: 1
training:
  target_tokens: "20K"
  gradient_accumulation_steps: 1
  save_interval: 30
  log_interval: 5
  output_dir: "./tests/test_train/experiments"
  experiment_name: "sim_run"
  use_mixed_precision: false
  dtype: "bfloat16"
  seed: 42
  compile_model: false
evaluating:
  batch_size: 2
  eval_interval: 15
  log_interval: 5
  empty_prefix_eos_ppl: true
  prompts:
    - "你好，"
    - "The capital of"
    - "水在标准大气压下的沸点是"
  num_generate_tokens: 10
early_stopping:
  enabled: false
  monitor: "val_loss"
  patience: 5
  min_delta: 1e-4
  mode: "min"
swanlab:
  use_swanlab: false
  swanlab_project: "TaiChu-Sim"
  swanlab_experiment_name: "sim"
  swanlab_log_dir: "./tests/test_train/swanlogs"
  swanlab_mode: "local"
